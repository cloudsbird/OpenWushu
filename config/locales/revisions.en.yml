      ins: "Added:"
    new:
      title: Edit this movement
      lead: Chinese names, pinyin and the order of movements come from the reference book and are not edited here. Leave a language empty if you don’t write it; someone else can add it.
      own_words: Write in your own words. Don’t copy text from books or rulebooks, even translated; their publishers own it. Facts such as directions and the order of actions are fine.
      one_per_line: one per line
      reference_hint: Where the facts come from, with page and figure, e.g. “Competition routines collection (scan), Taijiquan, p. 598, 图 I-3”.
      summary: What did you change?
      summary_placeholder: e.g. Wrote the steps and key points
      source: Source
      source_placeholder: Book and page, video, or your own teaching experience
      publish: Publish change
      submit: Submit for review
      cancel: Cancel
      publish_help: As a maintainer your change is published at once and recorded in the history.
      submit_help: A maintainer reviews your change before it is published. You’ll get an email when it’s decided.
      license: Published content is licensed CC BY-SA 4.0.
    create:
      published: Change published.
      submitted: Thanks! Your change was sent for review.
    restore:
      summary: Restored version r%{number}
      original: Restored the original text (r0)
      done: Version restored. It is saved as a new revision.
      same: The movement already matches that version.
    index:
      title:
        one: History · 1 revision
        other: History · %{count} revisions
      lead: Every published change to this movement’s text, newest first. This history is also the attribution record for the CC BY-SA licence.
      edit: Edit this movement
      by: "%{author} · %{date}"
      approved_by: approved by %{reviewer}
      source: "source: %{source}"
      restore: Restore this version
      confirm_restore: Restore this version? The current text is kept in the history.
      show_changes:
        one: Show the change (1 field)
        other: Show the changes (%{count} fields)
      origin: Original text
      origin_help: Names and order from the reference book; any descriptions written for the first version of OpenWushu.
  reviews:
    approved: Change approved and published.
    stale: The movement was edited after this change was submitted, in the same fields. Ask the contributor to redo it on the current text.
