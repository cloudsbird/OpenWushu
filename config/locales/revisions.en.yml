      note_hint: Required to send back or reject.
      request_changes: Request changes
      reject: Reject
      open_movement: Open the movement
  contributions:
    statuses:
      pending: In review
      published: Published
      changes_requested: Changes requested
      rejected: Rejected
    index:
      title: My contributions
      empty: You haven’t suggested any changes yet. Open a movement and choose “Edit this movement”.
  revision_mailer:
    submitted:
      subject: New change to review on OpenWushu
      heading: A change is waiting for review
      body: "%{author} suggested a change to %{movement}."
      source: "Source: %{source}"
      cta: Review the change
      why: You received this because you review changes on OpenWushu.
    decided:
      subject:
        published: "Your change to %{movement} was published"
        changes_requested: "Changes requested on your edit of %{movement}"
        rejected: "Your change to %{movement} was not accepted"
      heading:
        published: Your change is published
        changes_requested: A reviewer asked for changes
        rejected: Your change was not accepted
      body:
        published: Hi %{name}, %{reviewer} approved your change to %{movement}. It is now live and credited to you in the history.
        changes_requested: Hi %{name}, %{reviewer} reviewed your change to %{movement} and asked for some changes. You can submit an updated version.
        rejected: Hi %{name}, %{reviewer} reviewed your change to %{movement} and did not accept it.
      note: Reviewer’s note
      cta_published: See the movement
      cta_other: See your contributions
      why: You received this because you suggested a change on OpenWushu.
  activerecord:
    attributes:
      revision:
        summary: Summary
        source: Source
        note: Note
    errors:
      models:
        revision:
          attributes:
            base:
              no_changes: Nothing was changed.
              name_required: The English and Indonesian names can’t be empty.
              too_many_items: Lists can have at most %{count} lines.
              item_too_long: Each line can be at most %{count} characters.
