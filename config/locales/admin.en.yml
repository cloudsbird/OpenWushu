        port: Port
        port_help: 587 (STARTTLS) is most common; 465 uses TLS from the start.
        username: Username
        password: Password
        password_saved: A password is saved (encrypted). Leave empty to keep it.
        password_none: No password saved.
        tools: Check email
        test_help: Sends a test email to you (%{email}) with the saved settings. Save changes first.
        test: Send test email
        clear_password: Remove saved password
        confirm_clear: Remove the saved SMTP password?
  admin_mailer:
    test_email:
      subject: OpenWushu test email
      heading: Email is working
      body: Hi %{name}, this test was sent from Admin > Settings. If you can read it, OpenWushu can send verification and password emails.
      why: You received this because you sent a test from the admin panel.
