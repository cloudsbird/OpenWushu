    errors:
      models:
        routine:
          attributes:
            base:
              timings_order: "Each time must be 0 or more and not earlier than the one above it."
            status:
              no_movements: Add the movement list before publishing this routine.
            youtube_url:
              not_embeddable: "The owner of this video does not allow it to be embedded on other sites. Choose another video or ask the owner."
              not_found: "YouTube could not find this video. Check that the link is right and the video is public or unlisted."
              youtube: "Paste a YouTube video link, such as https://www.youtube.com/watch?v=… or https://youtu.be/…"
            video:
              video_type: Choose an MP4 or WebM file.
              video_size: The video must be %{max} GB or smaller.
